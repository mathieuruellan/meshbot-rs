[package]
name = "meshbot-rs"
version = "0.7.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures = "0.3.34"
meshcore-rs = { version = "=0.2.0", default-features = false, features = ["tcp"] }
pest = "2.9.2"
pest_derive = "2.9.2"
# Actions are scripts, not HTTP. The config loader that will read verb entries
# from YAML needs this; nothing reads YAML yet.
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
