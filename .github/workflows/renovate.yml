name: Renovate

# Mondays 05:00 UTC, the same cadence as the sibling concept2 project. Autodiscover
# plus a filter, not RENOVATE_REPOSITORIES: the token is account-scoped and can see
# every repo on the account, and that filter is the only thing stopping Renovate
# from opening PRs anywhere else.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve versions and open no PRs'
        required: false
        type: boolean
        default: false

# Every Renovate write goes through RENOVATE_TOKEN, so the automatic GITHUB_TOKEN
# needs nothing here beyond read access.
permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: renovatebot/github-action@v46.3.7
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'mathieuruellan/meshbot-rs'
          # Empty everywhere except a dispatched dry run: Renovate skips an
          # empty env value, so an empty string means a full run (branches,
          # PRs, the Dependency Dashboard issue). The old fallback was
          # 'extract', which made every run - including this cron - a dry run
          # that stops after the dependency scan and creates nothing.
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'lookup' || '' }}