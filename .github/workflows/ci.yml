name: CI

# Two things happen here and they are not the same thing:
#
#   push to main  -> checks, then a `latest` image. Plus the versioned image
#                    when that push is the merge of a release-please release PR.
#   push tag v*   -> checks, then that version's image. Never actually fires:
#                    see the note on the "Resolve tags" step.
#
# The version is decided by release-please from the commit messages, so the
# commitlint job below is what keeps that decision honest: a squash-merge title
# becomes the main-branch commit message, and that message is the only input the
# version has.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the image job opts up to packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR builds, but never a main push or a tag: those are the
  # ones that publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Conventional commit title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          # v6 dropped the `token:` input, so the action reads the token from the
          # environment instead. Without this it fails at startup with
          # "Parameter token or opts.auth is required", before validating
          # anything. `pull-requests: read` above scopes the token's abilities;
          # it does not put one in `env`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Listed explicitly rather than left to the action's default, so that
          # adding a type here is a deliberate act.
          types: |
            feat
            fix
            perf
            revert
            deps
            refactor
            docs
            test
            build
            ci
            chore
          requireScope: false
          # The PR *title* is still checked, and that is the part that matters:
          # a squash-merge title becomes the main-branch commit message, and
          # release-please reads nothing else. Single-commit validation is off
          # because release-please's own release PRs carry two commits by
          # design (the release bump plus whatever landed since the last tag),
          # and enforcing it would make this job reject the very PRs it exists
          # to protect.
          validateSingleCommit: false

  checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          # Scoped per event and ref, so a pull request cannot seed the build
          # cache that a main or tag build later reads back.
          key: ${{ github.event_name }}-${{ github.ref_name }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- --deny warnings

      - name: cargo test
        run: cargo test

  image:
    name: Build and push image
    # `needs: checks` on a conditionally-skipped job skips its dependents, so
    # `checks` is deliberately unconditional — it also runs on a tag push, which
    # is a second gate on the released image rather than wasted work.
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because the next step compares HEAD against its parent.
          # The default depth of 1 leaves no HEAD^ and the comparison fails.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The versioned tag, decided here rather than by the tag push.
      #
      # GitHub does not start workflow runs for events created by GITHUB_TOKEN,
      # and release-please creates its tag with exactly that token. So a tag push
      # never reaches this workflow: `latest` and `sha-<full>` move, the release
      # looks like it worked, and the bare version the host pins never appears.
      # 0.2.0 exists only because it was dispatched by hand.
      #
      # release-please *does* commit `.release-please-manifest.json` in its
      # release PR, so on the merge of that PR the version is already sitting in
      # the tree of a main push this workflow does see. Reading it here makes the
      # released image independent of the tag push, and needs no PAT to arrange.
      #
      # The gate is "did this push change the manifest", not "is it a release
      # commit" — a merge that leaves the manifest alone is not a release, and
      # without the gate it would re-tag the current version with new code.
      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          {
            echo 'type=semver,pattern={{version}}'
            echo 'type=ref,event=branch'
            echo 'type=sha,format=long'
            echo 'type=raw,value=latest'
          } > tags.txt
          version=''
          if ! git diff --quiet HEAD^ HEAD -- .release-please-manifest.json; then
            version=$(jq -er '.["."]' .release-please-manifest.json)
            echo "type=raw,value=$version" >> tags.txt
          fi
          {
            echo 'tags<<EOF'
            cat tags.txt
            echo 'EOF'
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On a push that is not a release: main, sha-<full>, latest
          # On a push that changed the manifest:  the above plus 0.3.0
          # On a tag push:                      the above plus 0.3.0 from semver
          #
          # The bare version is the one Renovate bumps cleanly in the meshcore
          # compose file. It is declared twice on purpose: `type=semver` covers a
          # tag push, `type=raw` covers the main push, and metadata-action
          # deduplicates the overlap. The Dockerfile owns
          # org.opencontainers.image.source, so it is not repeated here.
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision={{sha}}
            org.opencontainers.image.created={{timestamp}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # The meshbot host is x86-64. Adding arm64 here would bring QEMU
          # emulation of a full Rust build, which roughly doubles this job.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
